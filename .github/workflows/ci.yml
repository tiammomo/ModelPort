name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CARGO_TERM_COLOR: always
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Activate pinned Rust toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Linux developer toolchain
        run: ./scripts/doctor.sh --development

      - name: Run all checks
        run: ./scripts/check-all.sh

      - name: Audit locked dependencies
        run: |
          if [[ ! -x target/cargo-audit/bin/cargo-audit ]]; then
            cargo install cargo-audit --locked --version 0.22.2 --root target/cargo-audit
          fi
          target/cargo-audit/bin/cargo-audit audit --deny warnings --file Cargo.lock
          if [[ ! -x target/cargo-deny/bin/cargo-deny ]]; then
            cargo install cargo-deny --locked --version 0.20.2 --root target/cargo-deny
          fi
          target/cargo-deny/bin/cargo-deny check
          node scripts/audit-dashboard.mjs

      - name: Validate Docker Compose manifest
        env:
          MODELPORT_COMPOSE_ENV_FILE: deploy/docker/modelport.env.example
        run: |
          release_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          grep -F "ghcr.io/tiammomo/modelport:${release_version}" deploy/release/compose.yml
          grep -F "ghcr.io/tiammomo/modelport-dashboard:${release_version}" deploy/release/compose.yml
          docker compose --env-file deploy/docker/modelport.env.example config --quiet
          MODELPORT_COMPOSE_ENV_FILE="$PWD/deploy/docker/modelport.env.example" \
          MODELPORT_CONFIG_FILE="$PWD/config.example.toml" \
            docker compose \
              --env-file deploy/docker/modelport.env.example \
              -f deploy/release/compose.yml config --quiet
          runtime_env="${RUNNER_TEMP}/modelport-runtime.env"
          database_ca="${RUNNER_TEMP}/database-ca.pem"
          ownership_file="${RUNNER_TEMP}/modelport-ownership.toml"
          install -m 600 /dev/null "$runtime_env"
          install -m 600 /dev/null "$database_ca"
          printf '%s\n' 'ci-placeholder-ca' > "$database_ca"
          printf '%s\n' \
            'MODELPORT_DATABASE_URL=postgres://modelport:ci-only@db.example:5432/modelport?sslmode=verify-full&sslrootcert=/run/modelport/database-ca.pem' \
            'MODELPORT_AUTH_TOKEN=ci-router-token-with-sufficient-entropy' \
            'MODELPORT_HEALTHCHECK_API_KEY=ci-healthcheck-key-with-sufficient-entropy' \
            'MODELPORT_ADMIN_USERNAME=admin' \
            'MODELPORT_ADMIN_PASSWORD=MpCi_7vN4qL9tR2xK6m' \
            'MODELPORT_BACKUP_ADMIN_USERNAME=backup-admin' \
            'MODELPORT_BACKUP_ADMIN_EMAIL=backup-admin@example.com' \
            'MODELPORT_BACKUP_ADMIN_PASSWORD=MpCi_8zM5rT1wQ7xL4n' \
            'MODELPORT_OIDC_ISSUER=https://identity.example.com' \
            'MODELPORT_OIDC_CLIENT_ID=modelport-ci' \
            'MODELPORT_OIDC_CLIENT_SECRET=ci-oidc-client-secret-with-sufficient-entropy' \
            'MODELPORT_OIDC_REDIRECT_URI=https://modelport.example.com/admin/auth/oidc/callback' \
            'MODELPORT_OIDC_AUTO_PROVISION=0' \
            'DEEPSEEK_ANTHROPIC_AUTH_TOKEN=ci-provider-token-with-sufficient-entropy' \
            > "$runtime_env"
          printf '%s\n' \
            'schema_version = 1' \
            '[platform]' \
            'owner = "ci-platform-owner"' \
            'backups = ["ci-platform-backup"]' \
            '[coverage]' \
            'timezone = "UTC"' \
            'business_hours = "Monday-Friday 09:00-18:00"' \
            'primary_channel = "ci-primary-oncall"' \
            'backup_channel = "ci-backup-oncall"' \
            'acknowledgement_minutes = 15' \
            '[escalation]' \
            'database = "ci-database-oncall"' \
            'identity = "ci-identity-oncall"' \
            'security = "ci-security-oncall"' \
            'cloud_billing = "ci-finops-oncall"' \
            > "$ownership_file"
          MODELPORT_IMAGE='modelport:ci@sha256:1111111111111111111111111111111111111111111111111111111111111111' \
          MODELPORT_DASHBOARD_IMAGE='modelport-dashboard:ci@sha256:2222222222222222222222222222222222222222222222222222222222222222' \
          MODELPORT_RUNTIME_ENV_FILE="$runtime_env" \
          MODELPORT_CONFIG_FILE="$PWD/config.example.toml" \
          MODELPORT_DATABASE_CA_FILE="$database_ca" \
          MODELPORT_OWNERSHIP_FILE="$ownership_file" \
            ./scripts/production-preflight.sh
          MODELPORT_IMAGE='modelport:ci@sha256:1111111111111111111111111111111111111111111111111111111111111111' \
          MODELPORT_DASHBOARD_IMAGE='modelport-dashboard:ci@sha256:2222222222222222222222222222222222222222222222222222222222222222' \
          MODELPORT_RUNTIME_ENV_FILE="$runtime_env" \
          MODELPORT_CONFIG_FILE="$PWD/config.example.toml" \
          MODELPORT_DATABASE_CA_FILE="$database_ca" \
          MODELPORT_OWNERSHIP_FILE="$ownership_file" \
            docker compose -f deploy/production/compose.single.yml config --quiet

      - name: Validate Nginx and observability assets
        run: |
          python3 -m json.tool \
            deploy/observability/grafana/modelport-overview.json >/dev/null
          docker run --rm \
            --entrypoint nginx \
            -v "$PWD/deploy/docker/dashboard.nginx-main.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/docker/dashboard.nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.30.4-alpine -t
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/deploy/observability/prometheus/prometheus.example.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/observability/prometheus/modelport-alerts.yml:/etc/prometheus/rules/modelport-alerts.yml:ro" \
            -v /dev/null:/run/secrets/modelport_metrics_key:ro \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/deploy/observability/prometheus/blackbox.example.yml:/etc/blackbox_exporter/config.yml:ro" \
            -v /dev/null:/run/secrets/modelport_probe_key:ro \
            prom/blackbox-exporter:v0.27.0 \
              --config.file=/etc/blackbox_exporter/config.yml \
              --config.check

  postgres-e2e:
    name: PostgreSQL dashboard E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: modelport
          POSTGRES_USER: modelport
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modelport -d modelport"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      CARGO_TERM_COLOR: always
      MODELPORT_BIND: 127.0.0.1:38082
      MODELPORT_DATABASE_URL: postgres://modelport:ci-postgres-password@127.0.0.1:5432/modelport
      MODELPORT_TEST_DATABASE_URL: postgres://modelport:ci-postgres-password@127.0.0.1:5432/modelport
      MODELPORT_DATABASE_TLS_MODE: disable
      MODELPORT_AUTH_TOKEN: ci-router-token-with-sufficient-entropy
      MODELPORT_ADMIN_USERNAME: admin
      MODELPORT_ADMIN_PASSWORD: MpCi_7vN4qL9tR2xK6m
      MODELPORT_DEFAULT_PROVIDER: custom
      CUSTOM_OPENAI_BASE_URL: http://127.0.0.1:38084/v1
      CUSTOM_OPENAI_API_KEY: ci-custom-provider-key-with-sufficient-entropy
      CUSTOM_OPENAI_MODEL: ci-model

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            e2e-cargo-${{ runner.os }}-${{ runner.arch }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dashboard and browser dependencies
        run: |
          npm --prefix dashboard ci --no-audit --no-fund
          cd dashboard
          npx playwright install --with-deps chromium

      - name: Verify PostgreSQL migrations and transactional ledger paths
        run: |
          cargo test --locked --test migration_preserves_history \
            current_schema_migration_preserves_legacy_requests_and_attempts -- --exact
          cargo test --locked postgres_state_
          cargo test --locked postgres_critical_paths_use_database_transactions_and_aggregation
          cargo test --locked \
            enterprise_ledger::tests::postgres_usage_admission_is_atomic_across_concurrent_transactions \
            -- --exact
          cargo test --locked \
            enterprise_ledger::tests::postgres_operations_incident_queries_round_trip \
            -- --exact

      - name: Build and start PostgreSQL-backed ModelPort
        run: |
          cargo build --locked --bin model-port
          export MODELPORT_CONFIG="${RUNNER_TEMP}/modelport-no-config.toml"
          export MODELPORT_ENV_FILE="${RUNNER_TEMP}/modelport-no-env"
          target/debug/model-port > "${RUNNER_TEMP}/modelport-e2e.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/modelport-e2e.pid"
          for _ in {1..80}; do
            if curl -fsS http://127.0.0.1:38082/livez >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "${RUNNER_TEMP}/modelport-e2e.pid")" 2>/dev/null; then
              sed -n '1,200p' "${RUNNER_TEMP}/modelport-e2e.log"
              exit 1
            fi
            sleep 0.25
          done
          sed -n '1,200p' "${RUNNER_TEMP}/modelport-e2e.log"
          exit 1

      - name: Run dashboard E2E
        run: npm --prefix dashboard run e2e

      - name: Stop backend
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/modelport-e2e.pid" ]]; then
            kill "$(cat "${RUNNER_TEMP}/modelport-e2e.pid")" 2>/dev/null || true
          fi

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-dashboard-e2e-diagnostics
          path: |
            ${{ runner.temp }}/modelport-e2e.log
            dashboard/playwright-report
            dashboard/test-results
          if-no-files-found: ignore
          retention-days: 7
