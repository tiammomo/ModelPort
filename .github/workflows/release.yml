name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binary:
    name: Build and attest binary
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Validate tag and repository
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = \"\\([^\"]*\\)\"/\\1/p' Cargo.toml | head -n 1)"
          dashboard_version="$(node -p "require('./dashboard/package.json').version")"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$cargo_version" == "$version" ]]
          [[ "$dashboard_version" == "$version" ]]
          ./scripts/check-all.sh

      - name: Audit locked dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2 --root target/cargo-audit
          target/cargo-audit/bin/cargo-audit audit --deny warnings --file Cargo.lock
          cargo install cargo-deny --locked --version 0.20.2 --root target/cargo-deny
          target/cargo-deny/bin/cargo-deny check
          node scripts/audit-dashboard.mjs

      - name: Build release archive
        env:
          MODELPORT_BUILD_REVISION: ${{ github.sha }}
          MODELPORT_BUILD_SOURCE_STATE: clean
        run: |
          cargo build --release --locked
          version="${GITHUB_REF_NAME#v}"
          archive="model-port-v${version}-linux-amd64"
          mkdir -p "target/release-package/${archive}" dist
          cp target/release/model-port "target/release-package/${archive}/"
          cp README.md LICENSE CHANGELOG.md "target/release-package/${archive}/"
          tar -C target/release-package -czf "dist/${archive}.tar.gz" "$archive"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/model-port-${{ github.ref_name }}-linux-amd64.tar.gz
          format: spdx-json
          output-file: dist/model-port-${{ github.ref_name }}-linux-amd64.spdx.json
          upload-artifact: false

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.spdx.json > SHA256SUMS

      - name: Attest binary provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/model-port-${{ github.ref_name }}-linux-amd64.tar.gz

      - name: Attest binary SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/model-port-${{ github.ref_name }}-linux-amd64.tar.gz
          sbom-path: dist/model-port-${{ github.ref_name }}-linux-amd64.spdx.json

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist
          if-no-files-found: error
          retention-days: 14

  containers:
    name: Publish ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - title: backend image
            image: modelport
            dockerfile: Dockerfile
          - title: dashboard image
            image: modelport-dashboard
            dockerfile: dashboard/Dockerfile

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.0.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODELPORT_VERSION=${{ steps.image.outputs.version }}
            MODELPORT_SOURCE_REVISION=${{ github.sha }}
            MODELPORT_SOURCE_STATE=clean
            MODELPORT_BUILD_DATE=${{ steps.image.outputs.build_date }}

      - name: Attest container provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [binary, containers]
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Create immutable release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "ModelPort $GITHUB_REF_NAME"
