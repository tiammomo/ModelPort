[package]
name = "modelport-ops-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Deterministic, read-only operations agent for ModelPort."
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
modelport-ops-protocol = { path = "../crates/ops-protocol" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
